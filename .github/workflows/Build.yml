name: Build ArteXCrit Kernel with SukiSU-Ultra + SUSFS + KPM for Marble

on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.2 ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies + lld
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libelf-dev liblz4-tool libncurses5-dev libssl-dev python3 unzip zip zlib1g-dev cpio lzop rsync squashfs-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu lld wget patch

      - name: Download and Setup AOSP Clang r584948b
        run: |
          mkdir -p \~/aosp-clang
          cd \~/aosp-clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/42d2c090c14c9c7f4dfd365ae551e2b959dc775c/clang-r584948b.tar.gz -O clang-r584948b.tar.gz
          tar -xzf clang-r584948b.tar.gz
          rm clang-r584948b.tar.gz
          echo "$HOME/aosp-clang/bin" >> $GITHUB_PATH
          clang --version
          ld.lld --version

      - name: Super Clean source tree
        run: |
          make ARCH=arm64 mrproper || true
          rm -f .config* .*.cmd *.o *.ko Module.symvers vmlinux System.map .version .old .tmp_versions || true
          rm -rf out scripts/basic/* scripts/kconfig/* .tmp* .*.swp || true
          git clean -fdx -e .github/ || true
          git reset --hard HEAD || true
          git status --porcelain || true

      - name: Apply SukiSU-Ultra patches (includes KPM base)
        run: |
          git clone https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch --depth=1 sukisu-patches
          cd sukisu-patches
          bash setup.sh main || echo "Warnings OK"
          cd ..

      - name: Apply SUSFS patches
        run: |
          git clone https://github.com/infectedmushi/susfs4ksu --depth=1 susfs-patches
          cd susfs-patches/kernel_patches
          for patch in *.patch; do
            echo "Applying $patch..."
            patch -p1 --directory=../../../ < "$patch" || echo "Patch $patch failed"
          done
          cd ../../..
          echo 'CONFIG_SUSFS=y' >> out/.config || true

      - name: Build GKI Kernel with ArteXCrit tag + KPM
        env:
          ARCH: arm64
          SUBARCH: arm64
          CC: clang
          LD: ld.lld
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          export PATH=$HOME/aosp-clang/bin:$PATH
          make O=out ARCH=arm64 gki_defconfig
          echo 'CONFIG_LOCALVERSION="-ArteXCrit-SukiSU-SUSFS-KPM"' >> out/.config
          echo 'CONFIG_KPM=y' >> out/.config
          echo 'CONFIG_KALLSYMS=y' >> out/.config
          echo 'CONFIG_KALLSYMS_ALL=y' >> out/.config || true
          make O=out ARCH=arm64 olddefconfig
          make O=out ARCH=arm64 -j$(nproc --all) CC=clang LD=ld.lld

      - name: Package AnyKernel3 Zip with Custom Script
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          cp out/arch/arm64/boot/Image* AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/ || true
          mkdir -p AnyKernel3/dtb
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} AnyKernel3/dtb/ \; || true

          cat > AnyKernel3/anykernel.sh << 'EOF'
          properties() { '
          kernel.string=ArteXCrit Kernel with SukiSU-Ultra + SUSFS + KPM by DC
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=marble
          device.name2=marblein
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
            set_perm_recursive 0 0 755 644 $ramdisk/*;
            set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
          }

          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          ui_print "Installing ArteXCrit Kernel with SukiSU-Ultra + SUSFS + KPM..."
          split_boot;
          flash_boot;
          ui_print "ArteXCrit Kernel installed successfully!";
          EOF

          cd AnyKernel3
          zip -r9 ../ArteXCrit-Marble-SukiSU-SUSFS-KPM.zip * -x .git README.md *placeholder LICENSE ./*.md
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArteXCrit-Kernel-marble-SukiSU-SUSFS-KPM
          path: ArteXCrit-Marble-SukiSU-SUSFS-KPM.zip
          retention-days: 7
